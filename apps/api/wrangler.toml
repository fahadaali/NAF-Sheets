# NAF Sheets — API Worker (spec docs/spec.md §4).
#
# No secret in this file, ever. Secrets go through:
#   wrangler secret put AUTH_CLIENT_SECRET
# No resource id here either (owner, 2026-11-11): D1, KV, R2 and the queues are
# created by `wrangler deploy` on the first deploy (automatic provisioning) and
# found again by name or by the deployed binding afterwards. Values not decided
# in the code are set in the dashboard (docs/cloudflare-setup.md §3).

name = "naf-sheets-api"
main = "src/index.ts"
compatibility_date = "2026-07-27"
# Required by @cloudflare/vitest-pool-workers; harmless for the Worker itself.
compatibility_flags = ["nodejs_compat"]
# Keep the variables set in the dashboard (PLATFORM_ID, BASECAMP_ACCOUNT_ID,
# GOOGLE_CLIENT_ID) when deploying: without this, a deploy removes every
# variable that is not in [vars].
keep_vars = true

# ─────────────────────────────────────────────────────────────
# Routes on the platform's host (docs/cloudflare-setup.md §6). The web app is
# Cloudflare Pages on the same host; these paths go to this Worker, the rest
# to Pages. Host decided by the owner 2026-11-11 (spec §17-4): sheets.naflaw.sa.
# ─────────────────────────────────────────────────────────────
routes = [
  { pattern = "sheets.naflaw.sa/api/*", zone_name = "naflaw.sa" },
  { pattern = "sheets.naflaw.sa/auth/*", zone_name = "naflaw.sa" },
  { pattern = "sheets.naflaw.sa/webhooks/*", zone_name = "naflaw.sa" },
  { pattern = "sheets.naflaw.sa/health", zone_name = "naflaw.sa" },
]

# ─────────────────────────────────────────────────────────────
# Non-secret variables
# ─────────────────────────────────────────────────────────────
[vars]
# naf-id issuer. Compared literally with `iss`: no trailing slash.
AUTH_ISSUER = "https://app.naflaw.sa"
# Set in the dashboard (Worker → Settings → Variables and Secrets), not here:
#   PLATFORM_ID          case-sensitive; equals the platform row in the naf-id
#                        admin panel (OPEN_QUESTIONS.md #2). Until it is set,
#                        every sign-in fails at naf-id.
#   BASECAMP_ACCOUNT_ID  NAF's Basecamp account id; no link works until it is set.
#   GOOGLE_CLIENT_ID     the Google OAuth client id (not secret).
# Sync (src/sync): the public HTTPS origin Basecamp posts webhooks to (spec
# §17-4, decided by the owner 2026-11-11). See apps/api/OPEN_QUESTIONS.md S10.
PUBLIC_API_ORIGIN = "https://sheets.naflaw.sa"
# Secrets for these two modules — only via `wrangler secret put`, never here:
#   BASECAMP_CLIENT_ID, BASECAMP_CLIENT_SECRET, GOOGLE_CLIENT_SECRET,
#   TOKEN_ENCRYPTION_KEY (32 random bytes, base64; see src/crypto.ts)
# Until they are set, these routes answer 503 *_not_configured.

# ─────────────────────────────────────────────────────────────
# D1 — metadata, mappings, members, audit log
#   created by the first deploy: naf-sheets
# Migrations live at the repository root (forward-only).
# ─────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "naf-sheets"
migrations_dir = "../../migrations"

# ─────────────────────────────────────────────────────────────
# KV
#   created by the first deploy: AUTH_KV     (naf-auth sessions + JWKS cache)
#   created by the first deploy: SETTINGS    (settings, short-lived tokens)
# ─────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "AUTH_KV"

[[kv_namespaces]]
binding = "SETTINGS"

# ─────────────────────────────────────────────────────────────
# R2
#   created by the first deploy: naf-sheets-snapshots
#   created by the first deploy: naf-sheets-attachments
# ─────────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "naf-sheets-snapshots"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "naf-sheets-attachments"

# Daily backups (spec §14; src/phase7/backup.ts, docs/backups.md).
#   created by the first deploy: naf-sheets-backups
# Decided 2026-11-10: the bucket stays in this Cloudflare account (B3), and
# old runs are removed by the retention policy, in this bucket only (B2;
# src/phase7/retention.ts, docs/backups.md §6).
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "naf-sheets-backups"

# ─────────────────────────────────────────────────────────────
# Queues
#   created by the first deploy: bc-outbound
#   created by the first deploy: bc-outbound-dlq
#   created by the first deploy: bc-inbound
#   created by the first deploy: bc-inbound-dlq
#
# bc-outbound: platform → Basecamp writes (§9.2). The consumer retries with
#              message.retry (Retry-After on 429, exponential backoff on 5xx)
#              and gives a message up after its 5th attempt itself: it sends
#              it to bc-outbound-dlq (BC_OUTBOUND_DLQ), records it in D1
#              sync_dead_letters and puts the row in `error` (§9.2.8).
#              max_retries / dead_letter_queue below are the platform's
#              backstop for a consumer that crashes.
# bc-inbound: raw Basecamp webhook deliveries, acknowledged with 200 at once
#             and processed here (§9.3.3), and «مزامنة الآن» requests.
# ─────────────────────────────────────────────────────────────
[[queues.producers]]
binding = "BC_OUTBOUND"
queue = "bc-outbound"

[[queues.producers]]
binding = "BC_INBOUND"
queue = "bc-inbound"

[[queues.producers]]
binding = "BC_OUTBOUND_DLQ"
queue = "bc-outbound-dlq"

# Not used by the code: bound so that the first deploy creates the queue
# (only bound queues are provisioned), which bc-inbound's dead_letter_queue names.
[[queues.producers]]
binding = "BC_INBOUND_DLQ"
queue = "bc-inbound-dlq"

# 50 per batch (was 10): the consumer loads each workbook once per batch
# (docs/load-test.md L2), so a larger batch saves loads; 50 tasks at about
# 1.2 Basecamp requests each fit in under 15 s at 45 requests per 10 s.
[[queues.consumers]]
queue = "bc-outbound"
max_batch_size = 50
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "bc-outbound-dlq"

[[queues.consumers]]
queue = "bc-inbound"
max_batch_size = 10
max_retries = 5
dead_letter_queue = "bc-inbound-dlq"

# ─────────────────────────────────────────────────────────────
# Durable Object — one WorkbookRoom per workbook (§11)
# ─────────────────────────────────────────────────────────────
[[durable_objects.bindings]]
name = "WORKBOOK_ROOM"
class_name = "WorkbookRoom"

# One BasecampRateGate for the whole platform (src/basecamp-rate-gate.ts):
# every Basecamp request takes its slot there — 45 in any 10 s, under
# Basecamp's documented 50 per 10 s per IP (spec §9.2.9), across all isolates.
[[durable_objects.bindings]]
name = "BASECAMP_RATE_GATE"
class_name = "BasecampRateGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkbookRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BasecampRateGate"]

# ─────────────────────────────────────────────────────────────
# Cron — reconciliation every 15 minutes (§9.4), and the daily backup
# (§14) at 00:23 UTC = 03:23 Riyadh (src/background.ts BACKUP_CRON).
# ─────────────────────────────────────────────────────────────
[triggers]
crons = ["*/15 * * * *", "23 0 * * *"]
