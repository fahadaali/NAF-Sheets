# Gate for the RTL grid layer (spike/univer/src/rtl-grid.ts).
#
# The layer hooks Univer internals. This workflow is what keeps a Univer
# upgrade, a dependency change or a browser change from silently breaking it:
# it builds the spike page and runs the interaction suite in Chromium, Firefox
# and WebKit (Safari's engine). A pull request that changes any @univerjs
# version must pass it before merging.
name: RTL grid

on:
  push:
    paths:
      - 'spike/univer/**'
      - '.github/workflows/rtl-grid.yml'
  pull_request:
    paths:
      - 'spike/univer/**'
      - '.github/workflows/rtl-grid.yml'
  workflow_dispatch:

jobs:
  interactions:
    name: interactions (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: spike/univer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spike/univer/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run typecheck
      - run: npm run build
      - name: Serve the built page
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4173/ > /dev/null && exit 0; sleep 1; done
          cat preview.log; exit 1
      - name: Interaction suite
        run: node rtl-interactions.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-grid-${{ matrix.browser }}
          path: |
            spike/univer/results/rtl-interactions*.json
            spike/univer/results/mirror-*.png
          retention-days: 30
