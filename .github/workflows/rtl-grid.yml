# Gate for the RTL grid layer (packages/univer-rtl/src/rtl-grid.ts).
#
# The layer hooks Univer internals. This workflow is what keeps a Univer
# upgrade, a dependency change or a browser change from silently breaking it:
# from the root workspace install it checks the @univerjs pins, runs the unit
# tests, builds the package's harness page and runs the interaction suite in
# Chromium, Firefox and WebKit (Safari's engine). A pull request that changes
# any @univerjs version must pass it before merging.
#
# spike/univer keeps the phase 0 copy of the harness as evidence; it is no
# longer what this workflow tests.
name: RTL grid

on:
  push:
    paths:
      - 'packages/univer-rtl/**'
      - 'apps/*/package.json'
      - 'packages/*/package.json'
      - 'package-lock.json'
      - 'package.json'
      - '.npmrc'
      - '.github/workflows/rtl-grid.yml'
  pull_request:
    paths:
      - 'packages/univer-rtl/**'
      - 'apps/*/package.json'
      - 'packages/*/package.json'
      - 'package-lock.json'
      - 'package.json'
      - '.npmrc'
      - '.github/workflows/rtl-grid.yml'
  workflow_dispatch:

jobs:
  interactions:
    name: interactions (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: packages/univer-rtl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the workspace (root lockfile and .npmrc)
        run: npm ci
        working-directory: .
      - name: Univer pins equal VERIFIED_UNIVER_VERSION
        run: npm run check:pins
      - run: npm run typecheck
      - name: Unit tests (pure helpers, Univer contract)
        run: npm test
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run harness:typecheck
      - run: npm run harness:build
      - name: Serve the built harness on :4175
        run: |
          npm run harness:preview > "$RUNNER_TEMP/preview.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4175/ > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/preview.log"; exit 1
      - name: Interaction suite
        run: npm run test:rtl
        env:
          BROWSER: ${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-grid-${{ matrix.browser }}
          path: |
            packages/univer-rtl/results/rtl-interactions*.json
            packages/univer-rtl/results/mirror-*.png
          retention-days: 30
